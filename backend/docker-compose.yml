# ScrapGullak backend + MySQL 8.4.
#   docker compose up --build
# API: http://localhost:8080/api/v1   Swagger UI: http://localhost:8080/swagger-ui.html
#
# Before deploying anywhere but your own machine, change the passwords and set a real JWT_SECRET
# (e.g. `openssl rand -base64 48`), ideally from an .env file next to this compose file.
# Compose only uses .env to fill in the ${...} references below; it does not pass the file to the container.
# So every setting the app should receive must be listed under `app.environment`. These can be overridden
# from .env: DB_NAME, DB_USERNAME, DB_PASSWORD, MYSQL_ROOT_PASSWORD, APP_TIMEZONE, JPA_DDL_AUTO, JWT_SECRET,
# JWT_EXPIRATION_MINUTES, JWT_ISSUER, SEED_ENABLED, SEED_DEMO_DATA, SEED_ADMIN_PASSWORD, SEED_AGENT_PASSWORD,
# SEED_CUSTOMER_PASSWORD, CORS_ALLOWED_ORIGIN_PATTERNS.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-scrapgullak}
      MYSQL_USER: ${DB_USERNAME:-scrapgullak}
      MYSQL_PASSWORD: ${DB_PASSWORD:-scrapgullak}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    image: scrapgullak-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-scrapgullak}
      DB_USERNAME: ${DB_USERNAME:-scrapgullak}
      DB_PASSWORD: ${DB_PASSWORD:-scrapgullak}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      # DEV-ONLY default: override JWT_SECRET for any shared/production deployment.
      JWT_SECRET: ${JWT_SECRET:-c2NyYXBndWxsYWstZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZC0yMDI2IQ==}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      JWT_ISSUER: ${JWT_ISSUER:-scrapgullak}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # DEV-ONLY defaults (the documented demo passwords): override for any shared/production deployment.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
      SEED_AGENT_PASSWORD: ${SEED_AGENT_PASSWORD:-Agent@123}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-Customer@123}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://localhost:19006,http://192.168.*.*:*,exp://*}
    ports:
      - "8080:8080"

  # ---- PostgreSQL alternative --------------------------------------------
  # Comment out the `mysql` service above, uncomment this one, and in `app` set
  # SPRING_PROFILES_ACTIVE: postgres, DB_HOST: postgres, DB_PORT: 5432 and depends_on: postgres.
  #
  # postgres:
  #   image: postgres:16
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${DB_NAME:-scrapgullak}
  #     POSTGRES_USER: ${DB_USERNAME:-scrapgullak}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-scrapgullak}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12

volumes:
  mysql-data:
  # postgres-data:
