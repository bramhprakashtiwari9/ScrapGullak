# ScrapGullak backend configuration.
# Profiles: mysql (default), postgres, h2 (zero-setup in-memory demo / tests).
# Every value can be overridden with the environment variable shown in ${...}.

server:
  port: ${PORT:8080}
  shutdown: graceful        # finish in-flight requests (e.g. a weighing) on SIGTERM
  error:
    include-stacktrace: never

spring:
  application:
    name: scrapgullak-backend
  profiles:
    default: mysql
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  jwt:
    # DEV-ONLY Base64 key (>= 32 bytes decoded). Production MUST override with JWT_SECRET,
    # e.g. generated by: openssl rand -base64 48
    secret: ${JWT_SECRET:c2NyYXBndWxsYWstZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZC0yMDI2IQ==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    issuer: ${JWT_ISSUER:scrapgullak}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://localhost:19006,http://192.168.*.*:*,exp://*}
  seed:
    enabled: ${SEED_ENABLED:true}
    demo-data: ${SEED_DEMO_DATA:true}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    agent-password: ${SEED_AGENT_PASSWORD:Agent@123}
    customer-password: ${SEED_CUSTOMER_PASSWORD:Customer@123}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:scrapgullak}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scrapgullak}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:scrapgullak;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
